<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password â€” Mandate Rescue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='reference-match.css') }}">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 2L3 12h7l-1 6 9-10h-7l1-6z"/>
        </svg>
      </div>
      <span class="auth-brand-name">Mandate Rescue</span>
    </div>

    <!-- Step indicator -->
    <div class="auth-steps" id="auth-steps" aria-label="Reset progress">
      <div class="auth-step active" id="step-indicator-1">
        <span class="auth-step-num">1</span>
        <span class="auth-step-label">Enter email</span>
      </div>
      <div class="auth-step-connector"></div>
      <div class="auth-step" id="step-indicator-2">
        <span class="auth-step-num">2</span>
        <span class="auth-step-label">Set password</span>
      </div>
    </div>

    <div id="auth-banner" class="auth-banner hidden" role="alert" aria-live="polite"></div>

    <!-- Step 1: enter email -->
    <div id="step-email">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your registered email and we&rsquo;ll send a one-time reset code.</p>
      <form id="form-email" novalidate>
        <div class="form-field">
          <label class="form-label" for="fp-email">Email address</label>
          <input class="form-input" id="fp-email" type="email" autocomplete="email"
                 placeholder="you@company.com" required aria-required="true">
          <div class="field-error" id="err-fp-email" role="alert"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth" id="btn-send-otp">
          <span class="btn-label">Send reset code</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </div>

    <!-- Step 2: enter OTP + new password -->
    <div id="step-otp" class="hidden">
      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-subtitle">Enter the 6-digit code from your email, then choose a new password.</p>
      <form id="form-otp" novalidate>
        <div class="form-field">
          <label class="form-label" for="fp-otp">Reset code</label>
          <input class="form-input otp-input" id="fp-otp" type="text"
                 inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                 autocomplete="one-time-code" placeholder="000000" required
                 aria-required="true" aria-describedby="fp-otp-hint">
          <div class="field-hint" id="fp-otp-hint">6-digit code &middot; expires in 10 minutes</div>
          <div class="field-error" id="err-fp-otp" role="alert"></div>
        </div>
        <div class="form-field">
          <label class="form-label" for="fp-pw">New password</label>
          <div class="input-with-toggle">
            <input class="form-input" id="fp-pw" type="password"
                   autocomplete="new-password"
                   placeholder="At least 8 characters" required aria-required="true">
            <button type="button" class="toggle-pw" data-target="fp-pw"
                    aria-label="Show or hide password" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <ellipse cx="8" cy="8" rx="5.5" ry="3.5" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="err-fp-pw" role="alert"></div>
        </div>
        <div class="form-field">
          <label class="form-label" for="fp-cpw">Confirm new password</label>
          <div class="input-with-toggle">
            <input class="form-input" id="fp-cpw" type="password"
                   autocomplete="new-password" placeholder="Repeat password" required
                   aria-required="true">
            <button type="button" class="toggle-pw" data-target="fp-cpw"
                    aria-label="Show or hide password" aria-pressed="false">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <ellipse cx="8" cy="8" rx="5.5" ry="3.5" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="err-fp-cpw" role="alert"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth" id="btn-reset">
          <span class="btn-label">Set new password</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </div>

    <p class="auth-footer-link" style="margin-top:16px">
      <a href="/">â† Back to sign in</a>
    </p>

  </div>
</div>

<script src="{{ url_for('static', filename='auth.js') }}"></script>
<script>
(function() {
  'use strict';
  let resetEmail = '';
  const banner = document.getElementById('auth-banner');

  /* ---- Step 1: send OTP ---- */
  document.getElementById('form-email').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearBanner(banner);
    document.getElementById('err-fp-email').textContent = '';
    const btnEl = document.getElementById('btn-send-otp');
    resetEmail  = document.getElementById('fp-email').value.trim();
    if (!resetEmail) {
      document.getElementById('err-fp-email').textContent = 'Enter your email address.';
      return;
    }
    setLoading(btnEl, true);
    try {
      await fetch('/api/auth/forgot-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email: resetEmail }),
      });
      // Always show success â€” no email enumeration
      document.getElementById('step-email').classList.add('hidden');
      document.getElementById('step-otp').classList.remove('hidden');
      // Advance step indicator
      document.getElementById('step-indicator-1').classList.remove('active');
      document.getElementById('step-indicator-1').classList.add('done');
      document.getElementById('step-indicator-2').classList.add('active');
      showBanner(banner, 'If that email is registered, a reset code has been sent.', 'success');
    } catch {
      showBanner(banner, 'Network error â€” please check your connection and try again.', 'error');
    }
    setLoading(btnEl, false);
  });

  /* ---- OTP: digits only ---- */
  document.getElementById('fp-otp').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });

  /* ---- Step 2: set new password ---- */
  document.getElementById('form-otp').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearBanner(banner);
    ['err-fp-otp', 'err-fp-pw', 'err-fp-cpw']
      .forEach(id => { document.getElementById(id).textContent = ''; });

    const btnEl = document.getElementById('btn-reset');
    const otp   = document.getElementById('fp-otp').value.trim();
    const pw    = document.getElementById('fp-pw').value;
    const cpw   = document.getElementById('fp-cpw').value;

    if (otp.length !== 6) {
      document.getElementById('err-fp-otp').textContent = 'Enter the full 6-digit code.';
      document.getElementById('fp-otp').focus();
      return;
    }
    if (pw.length < 8) {
      document.getElementById('err-fp-pw').textContent = 'Password must be at least 8 characters.';
      document.getElementById('fp-pw').focus();
      return;
    }
    if (pw !== cpw) {
      document.getElementById('err-fp-cpw').textContent = 'Passwords do not match.';
      document.getElementById('fp-cpw').focus();
      return;
    }

    setLoading(btnEl, true);
    try {
      const resp = await fetch('/api/auth/reset-password', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email: resetEmail, otp, new_password: pw }),
      });
      const body = await resp.json();
      if (resp.ok && body.ok) {
        showBanner(banner, 'Password updated â€” redirecting to sign inâ€¦', 'success');
        setTimeout(() => { window.location.href = '/'; }, 1400);
      } else {
        showBanner(banner, body.message || 'Could not reset password. Try requesting a new code.', 'error');
        setLoading(btnEl, false);
      }
    } catch {
      showBanner(banner, 'Network error â€” please try again.', 'error');
      setLoading(btnEl, false);
    }
  });
})();
</script>
</body>
</html>
