<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Mandate Rescue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 2L3 12h7l-1 6 9-10h-7l1-6z"/>
        </svg>
      </div>
      <span class="auth-brand-name">Mandate Rescue</span>
    </div>

    <div id="auth-banner" class="auth-banner hidden" role="alert"></div>

    <!-- Step 1: enter email -->
    <div id="step-email">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your registered email and we'll send a reset code.</p>
      <form id="form-email" novalidate>
        <div class="form-field">
          <label class="form-label" for="fp-email">Email address</label>
          <input class="form-input" id="fp-email" type="email" autocomplete="email"
                 placeholder="you@company.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-auth" id="btn-send-otp">
          <span class="btn-label">Send reset code</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </div>

    <!-- Step 2: enter OTP + new password -->
    <div id="step-otp" class="hidden">
      <h1 class="auth-title">Enter reset code</h1>
      <p class="auth-subtitle">Check your email for a 6-digit code and set a new password.</p>
      <form id="form-otp" novalidate>
        <div class="form-field">
          <label class="form-label" for="fp-otp">Reset code</label>
          <input class="form-input otp-input" id="fp-otp" type="text"
                 inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                 autocomplete="one-time-code" placeholder="000000" required>
          <div class="field-error" id="err-fp-otp"></div>
        </div>
        <div class="form-field">
          <label class="form-label" for="fp-pw">New password</label>
          <div class="input-with-toggle">
            <input class="form-input" id="fp-pw" type="password"
                   autocomplete="new-password" placeholder="At least 8 chars" required>
            <button type="button" class="toggle-pw" data-target="fp-pw" aria-label="Toggle">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <ellipse cx="8" cy="8" rx="5.5" ry="3.5" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="err-fp-pw"></div>
        </div>
        <div class="form-field">
          <label class="form-label" for="fp-cpw">Confirm new password</label>
          <div class="input-with-toggle">
            <input class="form-input" id="fp-cpw" type="password"
                   autocomplete="new-password" placeholder="Repeat password" required>
            <button type="button" class="toggle-pw" data-target="fp-cpw" aria-label="Toggle">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <ellipse cx="8" cy="8" rx="5.5" ry="3.5" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="err-fp-cpw"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth" id="btn-reset">
          <span class="btn-label">Set new password</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </div>

    <p class="auth-footer-link"><a href="/">← Back to login</a></p>
  </div>
</div>

<script src="{{ url_for('static', filename='auth.js') }}"></script>
<script>
(function() {
  'use strict';
  let resetEmail = '';
  const banner = document.getElementById('auth-banner');

  // Step 1
  document.getElementById('form-email').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearBanner(banner);
    const btnEl = document.getElementById('btn-send-otp');
    setLoading(btnEl, true);
    resetEmail = document.getElementById('fp-email').value.trim();
    try {
      await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: resetEmail }),
      });
      // Always show success (no enumeration)
      document.getElementById('step-email').classList.add('hidden');
      document.getElementById('step-otp').classList.remove('hidden');
      showBanner(banner, 'If that email is registered, a code has been sent.', 'success');
    } catch (err) {
      showBanner(banner, 'Network error. Please try again.', 'error');
    }
    setLoading(btnEl, false);
  });

  // Step 2 OTP digits only
  document.getElementById('fp-otp').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });

  // Step 2 submit
  document.getElementById('form-otp').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearBanner(banner);
    const btnEl = document.getElementById('btn-reset');
    const otp   = document.getElementById('fp-otp').value.trim();
    const pw    = document.getElementById('fp-pw').value;
    const cpw   = document.getElementById('fp-cpw').value;

    document.getElementById('err-fp-otp').textContent = '';
    document.getElementById('err-fp-pw').textContent  = '';
    document.getElementById('err-fp-cpw').textContent = '';

    if (otp.length !== 6) {
      document.getElementById('err-fp-otp').textContent = 'Enter the 6-digit code.';
      return;
    }
    if (pw !== cpw) {
      document.getElementById('err-fp-cpw').textContent = 'Passwords do not match.';
      return;
    }
    setLoading(btnEl, true);
    try {
      const resp = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: resetEmail, otp, new_password: pw }),
      });
      const body = await resp.json();
      if (resp.ok && body.ok) {
        showBanner(banner, 'Password reset! Redirecting to login…', 'success');
        setTimeout(() => { window.location.href = '/'; }, 1400);
      } else {
        showBanner(banner, body.message || 'Could not reset password.', 'error');
        setLoading(btnEl, false);
      }
    } catch (err) {
      showBanner(banner, 'Network error.', 'error');
      setLoading(btnEl, false);
    }
  });
})();
</script>
</body>
</html>
