name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --- Fast test suite (excludes @pytest.mark.slow volume tests) ---------
      - name: Run pytest — fast suite with coverage
        env:
          WEBHOOK_SECRET: ci-test-webhook-secret-not-for-real-use-0123456789abcdef
          RAZORPAY_WEBHOOK_SECRET: ci-test-razorpay-secret-not-for-real-use-0123456789abcdef
          MANDATE_RESCUE_API_KEY: ci-test-api-key-0123456789abcdef
        run: |
          pytest -q \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # --- Slow / volume tests (separate step so they don't block fast feedback)
      - name: Run pytest — slow suite (volume tests)
        env:
          WEBHOOK_SECRET: ci-test-webhook-secret-not-for-real-use-0123456789abcdef
          RAZORPAY_WEBHOOK_SECRET: ci-test-razorpay-secret-not-for-real-use-0123456789abcdef
          MANDATE_RESCUE_API_KEY: ci-test-api-key-0123456789abcdef
        run: pytest -q -m slow

      # --- Standalone correctness audit (CLI mode, verifies audit_check.py works
      #     end-to-end: seed → agent run → all 7 rules pass) --------------------
      - name: Run standalone correctness audit CLI
        env:
          WEBHOOK_SECRET: ci-test-webhook-secret-not-for-real-use-0123456789abcdef
          MANDATE_RESCUE_API_KEY: ci-test-api-key-0123456789abcdef
          # Suppress LLM: no GROQ_API_KEY is set, so the agent falls back to
          # deterministic templates. This keeps CI fast and offline-safe.
          LLM_LIVE_TOP_N: "0"
        run: |
          python backend/seed.py
          python -c "
          import sys; sys.path.insert(0,'backend')
          import agent; agent.run_agent(policy=agent.PolicyParams(use_llm=False))
          print('Agent run complete (template-only, no LLM)')
          "
          python backend/audit_check.py

      # --- Standalone chaos suite CLI (10 adversarial scenarios) ---------------
      - name: Run standalone chaos-test CLI
        env:
          WEBHOOK_SECRET: ci-test-webhook-secret-not-for-real-use-0123456789abcdef
        run: python backend/chaos_test.py

      # --- Reproducible benchmark (3 strategies × 10 runs, real computed results)
      - name: Run benchmark CLI (reproducible strategy comparison)
        env:
          WEBHOOK_SECRET: ci-test-webhook-secret-not-for-real-use-0123456789abcdef
        run: python benchmark.py --n-runs 10 --seed 42
